name: Build Galkan VPN APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK & Licenses
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36.1 & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Prepare .env from GitHub Secrets (fallback to test AdMob IDs)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: |
          cp .env.example .env
          if [ -n "$ADMOB_APP_ID" ]; then
            sed -i "s|^ADMOB_APP_ID=.*|ADMOB_APP_ID=${ADMOB_APP_ID}|" .env
          fi
          if [ -n "$ADMOB_BANNER_ID" ]; then
            sed -i "s|^ADMOB_BANNER_ID=.*|ADMOB_BANNER_ID=${ADMOB_BANNER_ID}|" .env
          fi
          if [ -n "$ADMOB_REWARDED_ID" ]; then
            sed -i "s|^ADMOB_REWARDED_ID=.*|ADMOB_REWARDED_ID=${ADMOB_REWARDED_ID}|" .env
          fi
          if [ -n "$ADMOB_INTERSTITIAL_ID" ]; then
            sed -i "s|^ADMOB_INTERSTITIAL_ID=.*|ADMOB_INTERSTITIAL_ID=${ADMOB_INTERSTITIAL_ID}|" .env
          fi

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Debug APK
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Galkan-VPN-debug.apk

      - name: Build Signed Release APK & AAB (if keystore secrets provided)
        if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        env:
          KEYSTORE_BASE64_VALUE: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          printf '%s' "$KEYSTORE_BASE64_VALUE" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_PATH"
          gradle assembleRelease bundleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Galkan-VPN-release.apk
          cp app/build/outputs/bundle/release/app-release.aab Galkan-VPN-release.aab

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galkan-VPN-Debug-APK
          path: Galkan-VPN-debug.apk
          retention-days: 30

      - name: Upload Release APK & AAB Artifacts
        if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Galkan-VPN-Release-Signed
          path: |
            Galkan-VPN-release.apk
            Galkan-VPN-release.aab
          retention-days: 30

      - name: Create GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Galkan-VPN-debug.apk
            Galkan-VPN-release.apk
            Galkan-VPN-release.aab
          fail_on_unmatched_files: false
